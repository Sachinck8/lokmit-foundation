# A25 — nginx site config for the LOKMIT FOUNDATION SPA.
#
# Served from /usr/share/nginx/html (the Vite build output). Two concerns:
# 1. SPA fallback — React Router owns client-side URLs, so any path that
#    is not a real file resolves to index.html (deep links survive reload).
# 2. Cache policy — hashed /assets/ files are immutable (long cache);
#    index.html is never cached so new deploys are picked up immediately.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never serve hidden files (e.g. .env if one ever leaks into dist).
    location ~ /\. {
        deny all;
    }

    # Hashed production assets: content-addressed by Vite, immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The HTML entry point must revalidate so deploys go live immediately.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback for every other GET path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deployment probes: liveness of the static container itself.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # API calls stay same-origin by default (/api/v1 via VITE_API_BASE_URL
    # default) — the deployment platform reverse-proxies /api to the
    # backend service. Nothing is proxied inside this container so the
    # frontend image never needs backend addressing.
}
