spring:
  application:
    name: lokmit-foundation-backend

  # Database credentials are supplied through environment variables only.
  # The defaults are non-secret local-development conveniences.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lokmit_foundation}
    username: ${DB_USERNAME:lokmit_app}
    password: ${DB_PASSWORD:}

  servlet:
    # Multipart limits sit just above the A7.6.2 service limit so oversized
    # uploads reach the service and get the controlled 413 error envelope
    # (not a raw Tomcat MaxUploadSizeExceededException response).
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI / Swagger UI documentation
springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
  packages-to-scan: com.lokmit.foundation

# Application security configuration
app:
  security:
    jwt:
      # Secret key for signing JWTs - MUST be set in production via JWT_SECRET env var
      secret: ${JWT_SECRET:}
      # Access token expiration in milliseconds (default: 15 minutes)
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
      # Refresh token expiration in milliseconds (default: 7 days)
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
    # Bootstrap admin password - set via BOOTSTRAP_ADMIN_PASSWORD env var
    # Only used when admin password_hash is NULL
    bootstrap:
      admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    # Login brute-force protection (persistent, account-level lockout)
    login-protection:
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
      lockout-duration-minutes: ${LOGIN_LOCKOUT_DURATION_MINUTES:15}
    # CORS: explicit allow-list. Never "*" with credentials. The default here
    # covers local development (Vite dev server on 5173 / preview on 4173);
    # production sets APP_CORS_ALLOWED_ORIGINS in application-prod.yml.
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
    # Security headers (I-5). Static policy headers are configured in
    # SecurityConfig. HSTS is deliberately off in development (plain HTTP)
    # and enabled by the prod profile via APP_HSTS_ENABLED.
    headers:
      hsts-enabled: ${APP_HSTS_ENABLED:false}
      hsts-max-age-seconds: ${APP_HSTS_MAX_AGE_SECONDS:31536000}
      hsts-include-subdomains: ${APP_HSTS_INCLUDE_SUBDOMAINS:true}
    # Refresh-token housekeeping. Set cleanup-interval-minutes to 0 to disable.
    refresh-token:
      cleanup-interval-minutes: ${REFRESH_TOKEN_CLEANUP_INTERVAL_MINUTES:60}
    # I-6 request rate limiting for the two public, high-risk endpoints.
    # Per client IP, instance-local in-memory fixed windows. POST-only, so
    # preflights, health, Swagger, and authenticated admin APIs are untouched.
    rate-limit:
      login:
        enabled: ${RATE_LIMIT_LOGIN_ENABLED:true}
        capacity: ${RATE_LIMIT_LOGIN_CAPACITY:10}
        window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
        max-tracked-keys: ${RATE_LIMIT_MAX_TRACKED_KEYS:10000}
      contact:
        enabled: ${RATE_LIMIT_CONTACT_ENABLED:true}
        capacity: ${RATE_LIMIT_CONTACT_CAPACITY:5}
        window-seconds: ${RATE_LIMIT_CONTACT_WINDOW_SECONDS:60}
        max-tracked-keys: ${RATE_LIMIT_MAX_TRACKED_KEYS:10000}
    # Transactional outbox relay (A7.5). The relay materializes in-app
    # notifications from outbox_events rows written in the SAME transaction
    # as the originating business action. No external delivery (email/SMS)
    # happens here. Set polling-interval-seconds to 0 (or enabled=false) to
    # disable all relay work — the scheduled method still fires on its
    # interval (clamped to >= 1s) but exits immediately as a no-op, so
    # pending events simply stay queued.
    outbox:
      relay:
        enabled: ${OUTBOX_RELAY_ENABLED:true}
        polling-interval-seconds: ${OUTBOX_RELAY_POLLING_INTERVAL_SECONDS:30}
        batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
        retry-backoff-seconds: ${OUTBOX_RELAY_RETRY_BACKOFF_SECONDS:60}
        max-attempts: ${OUTBOX_RELAY_MAX_ATTEMPTS:5}
    # Resume file storage (A7.6). Database-blob decision: bytes live in
    # PostgreSQL (resumes_file_blobs, V17) — no filesystem paths, no
    # object-storage SDKs. 'db' = DatabaseFileStorage. Download endpoints,
    # candidate-facing authorization and rate limiting arrive in later
    # A7.6 phases.
    storage:
      type: ${STORAGE_TYPE:db}
    # Secure resume upload validation (A7.6.2). The 5 MiB SERVICE-level
    # limit produces the controlled PAYLOAD_TOO_LARGE error; the multipart
    # limits sit just above it so the service limit decides. Validation
    # rules themselves (PDF/DOC/DOCX content checks, MIME cross-check,
    # filename security) are code, not tunable policy.
    upload:
      max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE_BYTES:5242880}

logging:
  level:
    org.flywaydb: info
    org.hibernate.SQL: warn
    com.lokmit.foundation.security: debug