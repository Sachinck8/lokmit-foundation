# =====================================================================
# PRODUCTION profile — explicit, environment-driven configuration.
#
# Activate with:  --spring.profiles.active=prod   (or SPRING_PROFILES_ACTIVE=prod)
#
# Rules enforced by this file:
#   * No secrets in source control — every sensitive value comes from an
#     environment variable with NO default, so startup fails with a clear
#     "property is missing" message rather than silently using one.
#   * The schema belongs to Flyway; Hibernate only validates.
#   * CORS origins must be configured explicitly (APP_CORS_ALLOWED_ORIGINS).
#
# Required environment variables (see README "Production Configuration"):
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, APP_CORS_ALLOWED_ORIGINS
# =====================================================================

spring:
  # Database: strictly environment-driven, no defaults.
  # A missing variable fails startup with a clear unresolved-placeholder error.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    # The password is never echoed in logs or error messages by the application.
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    # Flyway owns the schema; Hibernate may only verify entity mappings.
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# CORS: production origins MUST be configured explicitly via the environment.
# No dev fallback here — a missing variable fails startup with a clear message.
app:
  security:
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

# Logging: production keeps noise low; no secrets are logged by the app.
logging:
  level:
    root: info
    org.flywaydb: info
    org.hibernate.SQL: warn
    com.lokmit.foundation.security: info

# Actuator: keep the existing minimal exposure (health, info) and hide
# health details from unauthenticated callers. No new endpoints are opened.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
